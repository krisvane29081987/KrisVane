<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KrisVane — Аккаунт</title>
  <meta name="color-scheme" content="dark" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#08090b;--card:#111318;--line:#242833;--text:#f5f7fb;--muted:#8e95a3;--accent:#6f7cff;--danger:#ff6b78;--ok:#63d79a}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,#171a27 0,transparent 36%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}
    .wrap{width:min(440px,100%)}.brand{text-align:center;margin-bottom:24px}.brand h1{font-size:34px;margin:0;letter-spacing:-1.4px}.brand p{color:var(--muted);margin:8px 0 0}
    .card{position:relative;isolation:isolate;background:rgba(17,19,24,.97);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.35),0 0 18px rgba(238,244,255,.082),0 0 38px rgba(225,235,255,.038);backdrop-filter:blur(16px)}
    .card::before{content:"";position:absolute;inset:-3px;border-radius:27px;padding:2px;pointer-events:none;z-index:-1;background:rgba(238,244,255,.135);filter:drop-shadow(0 0 7px rgba(240,245,255,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
    .cardGlow{position:absolute;inset:-22px;z-index:-2;pointer-events:none;border-radius:46px;filter:blur(9px);opacity:1}
    .glowTrack{position:absolute;inset:19px;border-radius:28px;padding:4px;background:conic-gradient(from 0deg,
      rgba(255,255,255,.03) 0deg,
      rgba(255,255,255,.03) var(--a1s),
      rgba(236,243,255,.22) var(--a1m),
      rgba(255,255,255,.035) var(--a1e),
      rgba(255,255,255,.03) var(--a2s),
      rgba(245,248,255,.18) var(--a2m),
      rgba(255,255,255,.035) var(--a2e),
      rgba(255,255,255,.03) var(--a3s),
      rgba(229,238,255,.15) var(--a3m),
      rgba(255,255,255,.03) var(--a3e),
      rgba(255,255,255,.03) 360deg);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude}
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:#0b0d11;padding:4px;border-radius:14px;margin-bottom:22px}.tab{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}.tab.active{background:#1b1e27;color:#fff}
    form{display:grid;gap:15px}.field{display:grid;gap:7px}.field.hidden{display:none}label{font-size:13px;color:#b9bfca;font-weight:650}input{width:100%;border:1px solid var(--line);background:#0b0d11;color:#fff;border-radius:13px;padding:13px 14px;font:inherit;outline:none;transition:.18s}input:focus{border-color:#6572ed;box-shadow:0 0 0 3px rgba(111,124,255,.13)}
    .hint{font-size:12px;color:var(--muted)}button.submit{margin-top:3px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#7884ff,#5f6be5);color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:.18s}.submit:hover{transform:translateY(-1px)}.submit:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .msg{display:none;border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.45}.msg.show{display:block}.msg.error{background:rgba(255,107,120,.09);border:1px solid rgba(255,107,120,.25);color:#ff9da6}.msg.ok{background:rgba(99,215,154,.08);border:1px solid rgba(99,215,154,.23);color:#91e8b9}
    .session{display:none;text-align:center}.session.show{display:block}
    .avatar{width:72px;height:72px;margin:0 auto 13px;border-radius:50%;display:grid;place-items:center;background:#202432;font-size:25px;font-weight:900;overflow:hidden;border:1px solid rgba(255,255,255,.15);box-shadow:0 0 20px rgba(255,255,255,.08)}
    .avatar img{width:100%;height:100%;display:block;object-fit:cover}
    .session h2{margin:0 0 7px}.session p{color:var(--muted);overflow-wrap:anywhere;margin:0 0 20px}
    .sessionActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{display:flex;align-items:center;justify-content:center;min-height:45px;border:1px solid var(--line);background:#171a20;color:#fff;padding:11px 12px;border-radius:13px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;transition:.2s}.action:hover{transform:translateY(-1px);border-color:#3a4050;background:#1b1e26}.action.primary{grid-column:1/-1;border-color:rgba(111,124,255,.38);background:linear-gradient(135deg,rgba(120,132,255,.22),rgba(95,107,229,.13));box-shadow:0 0 22px rgba(111,124,255,.07)}.action.logout{color:#ff9aa3}
    .small{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
    @media(max-width:460px){body{padding:16px}.card{padding:22px}.sessionActions{grid-template-columns:1fr}.action.primary{grid-column:auto}}
}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><h1>KrisVane</h1><p>Твой аккаунт магазина</p></div>
    <section id="mainCard" class="card"><div class="cardGlow" aria-hidden="true"><div id="glowTrack" class="glowTrack"></div></div>
      <div id="authBox">
        <div class="tabs">
          <button class="tab active" data-mode="login" type="button">Вход</button>
          <button class="tab" data-mode="signup" type="button">Регистрация</button>
        </div>
        <form id="authForm">
          <div class="field hidden" id="nameField"><label for="name">Имя</label><input id="name" autocomplete="name" maxlength="80" placeholder="Например: Иван" /></div>
          <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com" /></div>
          <div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Минимум 6 символов" /></div>
          <div class="field hidden" id="repeatField"><label for="repeatPassword">Повторите пароль</label><input id="repeatPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Повторите пароль" /></div>
          <div id="message" class="msg"></div>
          <button id="submitBtn" class="submit" type="submit">Войти</button>
        </form>
      </div>
      <div id="sessionBox" class="session">
        <div id="avatar" class="avatar">K</div>
        <h2>Вы вошли</h2>
        <p id="userText"></p>
        <div class="sessionActions">
          <a class="action primary" href="index.html">Перейти в магазин</a>
          <a class="action" href="account.html">Мой аккаунт</a>
          <button id="logoutBtn" class="action logout" type="button">Выйти</button>
        </div>
      </div>
    </section>
    <div class="small">KrisVane • безопасная авторизация</div>
  </main>

<script>
const SUPABASE_URL='https://cbkomiuylvumquhgrlve.supabase.co';
const SUPABASE_KEY='sb_publishable_OzfR7L5x3hQF56b4v7KT1g_q9tXF9sG';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let mode='login';
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll('.tab')];

function setMode(next){
  mode=next;
  tabs.forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
  $('nameField').classList.toggle('hidden',mode!=='signup');
  $('repeatField').classList.toggle('hidden',mode!=='signup');
  $('password').autocomplete=mode==='signup'?'new-password':'current-password';
  $('submitBtn').textContent=mode==='signup'?'Создать аккаунт':'Войти';
  clearMessage();
}
tabs.forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));

function message(text,type='error'){const el=$('message');el.textContent=text;el.className='msg show '+type}
function clearMessage(){$('message').className='msg';$('message').textContent=''}
function loading(on){$('submitBtn').disabled=on;$('submitBtn').textContent=on?'Подождите…':(mode==='signup'?'Создать аккаунт':'Войти')}
function friendly(err){
  const m=(err?.message||'').toLowerCase();
  if(m.includes('invalid login credentials')) return 'Неверный email или пароль.';
  if(m.includes('email not confirmed')) return 'Сначала подтвердите email по ссылке из письма.';
  if(m.includes('user already registered')) return 'Аккаунт с таким email уже существует.';
  if(m.includes('password')) return 'Проверьте пароль. Он должен соответствовать требованиям безопасности.';
  return err?.message||'Произошла ошибка. Попробуйте ещё раз.';
}

$('authForm').addEventListener('submit',async e=>{
  e.preventDefault();clearMessage();
  const email=$('email').value.trim(),password=$('password').value;
  if(mode==='signup'){
    const name=$('name').value.trim(),repeat=$('repeatPassword').value;
    if(!name)return message('Введите имя.');
    if(password!==repeat)return message('Пароли не совпадают.');
    loading(true);
    const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:'https://krisvane29081987.github.io/KrisVane/auth.html'}});
    loading(false);
    if(error)return message(friendly(error));
    if(data.session)return showSession(data.user);
    message('Аккаунт создан. Проверьте почту и подтвердите email, затем войдите.','ok');
  }else{
    loading(true);
    const {data,error}=await client.auth.signInWithPassword({email,password});
    loading(false);
    if(error)return message(friendly(error));
    showSession(data.user);
  }
});

$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();showAuth()});

async function showSession(user){
  $('authBox').style.display='none';
  $('sessionBox').classList.add('show');

  let profile=null;
  const {data,error}=await client.from('profiles').select('full_name,avatar_url').eq('id',user.id).single();
  if(!error)profile=data;

  const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split('@')[0]||'Пользователь';
  $('userText').textContent=`${name} • ${user?.email||''}`;

  const avatar=$('avatar');
  avatar.textContent='';
  if(profile?.avatar_url){
    const img=document.createElement('img');
    img.src=profile.avatar_url+(profile.avatar_url.includes('?')?'&':'?')+'v='+Date.now();
    img.alt='Аватар '+name;
    img.addEventListener('error',()=>{avatar.textContent=name.charAt(0).toUpperCase()});
    avatar.appendChild(img);
  }else{
    avatar.textContent=name.charAt(0).toUpperCase();
  }
}

function showAuth(){
  $('authBox').style.display='block';
  $('sessionBox').classList.remove('show');
}

const glowTrack=$('glowTrack');
const glowZones=[
  {angle:318,speed:9.8,width:42,target:318,targetAt:0},
  {angle:112,speed:10.2,width:48,target:112,targetAt:0},
  {angle:205,speed:9.6,width:38,target:205,targetAt:0}
];
let lastGlowTime=performance.now();

function circularDelta(from,to){
  return ((to-from+540)%360)-180;
}
function chooseGlowTarget(zone,now){
  const direction=Math.random()<.5?-1:1;
  const travel=55+Math.random()*105;
  zone.target=(zone.angle+direction*travel+360)%360;
  zone.targetAt=now+(travel/zone.speed)*1000;
}
glowZones.forEach(z=>chooseGlowTarget(z,lastGlowTime));

function animateGlow(now){
  const dt=Math.min((now-lastGlowTime)/1000,.05);
  lastGlowTime=now;

  glowZones.forEach(zone=>{
    let delta=circularDelta(zone.angle,zone.target);
    if(Math.abs(delta)<1.4 || now>=zone.targetAt){
      chooseGlowTarget(zone,now);
      delta=circularDelta(zone.angle,zone.target);
    }
    const maxStep=zone.speed*dt;
    const step=Math.sign(delta)*Math.min(Math.abs(delta),maxStep);
    zone.angle=(zone.angle+step+360)%360;
  });

  const z=[...glowZones].sort((a,b)=>a.angle-b.angle);
  const stops=[];
  z.forEach((zone,i)=>{
    const half=zone.width/2;
    let s=zone.angle-half,m=zone.angle,e=zone.angle+half;
    // CSS conic gradients cannot wrap a stop through 0°, so mirror wrapped zones.
    if(s<0){
      stops.push([0,zone.angle+360, e+360]);
      s+=360;m+=360;e+=360;
    }
    stops.push([s,m,e]);
  });

  // Use three original zones directly; values can exceed 360 safely only poorly,
  // so normalize and render via dynamically generated conic-gradient segments.
  const layers=glowZones.map((zone,i)=>{
    const a=zone.angle;
    const w=zone.width;
    const bright=i===0?'.36':i===1?'.30':'.255';
    return `conic-gradient(from ${a-w/2}deg, transparent 0deg, rgba(238,244,255,${bright}) ${w/2}deg, transparent ${w}deg, transparent 360deg)`;
  });
  glowTrack.style.background=layers.join(',')+',rgba(238,244,255,.052)';
  requestAnimationFrame(animateGlow);
}
requestAnimationFrame(animateGlow);

(async()=>{
  const {data:{session}}=await client.auth.getSession();
  if(session?.user)await showSession(session.user);
})();
client.auth.onAuthStateChange((_event,session)=>{if(session?.user)showSession(session.user)});
</script>
</body>
</html>
