<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KrisVane — System Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #090a0d;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 0;
    }

    .box {
      width: 420px;
      max-width: calc(100% - 40px);

      background: #111318;
      border: 1px solid #252936;
      border-radius: 20px;

      padding: 28px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;

      border: 0;
      border-radius: 12px;

      background: #5865f2;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .shipping-box {
      margin-top: 22px;
      padding-top: 18px;

      border-top: 1px solid #252936;
    }

    .shipping-title {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #cfd3ff;
    }

    input {
      box-sizing: border-box;

      width: 100%;
      padding: 13px 14px;
      margin-top: 10px;

      border: 1px solid #2b3040;
      border-radius: 12px;

      background: #08090c;
      color: #fff;

      font-size: 14px;

      outline: none;
    }

    input:focus {
      border-color: #5865f2;
    }

    #log {
      margin-top: 20px;

      background: #08090c;
      border-radius: 12px;

      padding: 15px;

      white-space: pre-wrap;
      word-break: break-word;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;

      min-height: 80px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>KrisVane Test</h1>

  <p>Проверка корзины и оформления заказа.</p>


  <button onclick="checkSession()">
    1. Проверить авторизацию
  </button>

  <button onclick="addTestProduct()">
    2. Добавить 2× M в корзину
  </button>

  <button onclick="checkout()">
    3. Оформить тестовый заказ
  </button>

  <button onclick="returnOrder1()">
    4. Вернуть заказ №1 на склад
  </button>

  <button onclick="testStatusManagement()">
    5. Проверить управление статусом
  </button>

  <button onclick="runOrder2Lifecycle()">
    6. Провести заказ №2 до готовности
  </button>


  <div class="shipping-box">

    <div class="shipping-title">
      🚚 Отправка заказа №2
    </div>

    <input
      id="carrier"
      type="text"
      value="Nova Poshta"
      placeholder="Служба доставки"
    >

    <input
      id="trackingNumber"
      type="text"
      value="TEST-TTN-000001"
      placeholder="ТТН"
    >

    <button onclick="shipOrder2()">
      7. Отправить заказ №2
    </button>

  </div>


  <div id="log">Готов к тесту.</div>

</div>


<script>

const SUPABASE_URL =
  'https://cbkomiuylvumquhgrlve.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_OzfR7L5x3hQF56b4v7KT1g_q9tXF9sG';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const log = document.getElementById('log');


function show(message) {
  log.textContent = message;
}


// ==========================================
// 1. ПРОВЕРКА АВТОРИЗАЦИИ
// ==========================================

async function checkSession() {

  show('Проверяем авторизацию...');

  const {
    data: { user },
    error
  } = await db.auth.getUser();


  if (error || !user) {

    show(
      '❌ Пользователь не авторизован.\n\n' +
      (error?.message || '')
    );

    return;
  }


  show(
    '✅ Авторизация работает\n\n' +
    'User ID:\n' +
    user.id +
    '\n\nEmail:\n' +
    user.email
  );
}


// ==========================================
// 2. ДОБАВЛЕНИЕ ТОВАРА В КОРЗИНУ
// ==========================================

async function addTestProduct() {

  show('Добавляем товар...');


  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();


  if (userError || !user) {

    show('❌ Сначала необходимо войти.');

    return;
  }


  const {
    data: variant,
    error: variantError
  } = await db
    .from('product_variants')
    .select(
      'id, name, stock_quantity, reserved_quantity'
    )
    .eq('sku', 'KV-TEST-001-M')
    .single();


  if (variantError) {

    show(
      '❌ Не удалось получить вариант:\n' +
      variantError.message
    );

    return;
  }


  let {
    data: cart,
    error: cartError
  } = await db
    .from('carts')
    .select('id')
    .eq('user_id', user.id)
    .maybeSingle();


  if (cartError) {

    show(
      '❌ Ошибка корзины:\n' +
      cartError.message
    );

    return;
  }


  if (!cart) {

    const {
      data: newCart,
      error: createError
    } = await db
      .from('carts')
      .insert({
        user_id: user.id
      })
      .select('id')
      .single();


    if (createError) {

      show(
        '❌ Не удалось создать корзину:\n' +
        createError.message
      );

      return;
    }


    cart = newCart;
  }


  const {
    error: itemError
  } = await db
    .from('cart_items')
    .upsert(
      {
        cart_id: cart.id,
        variant_id: variant.id,
        quantity: 2
      },
      {
        onConflict: 'cart_id,variant_id'
      }
    );


  if (itemError) {

    show(
      '❌ Не удалось добавить товар:\n' +
      itemError.message
    );

    return;
  }


  show(
    '✅ Товар добавлен в корзину!\n\n' +
    'Вариант: ' + variant.name +
    '\nКоличество: 2' +
    '\nНа складе: ' + variant.stock_quantity +
    '\nВ резерве сейчас: ' +
    variant.reserved_quantity
  );
}


// ==========================================
// 3. CHECKOUT
// ==========================================

async function checkout() {

  show('Оформляем заказ...');


  const {
    data,
    error
  } = await db.rpc(
    'checkout_cart',
    {
      p_recipient_name: 'Ivan Test',
      p_phone: '+380000000000',

      p_delivery_method: 'test',
      p_carrier: 'test',

      p_carrier_city_ref: null,
      p_carrier_branch_ref: null,

      p_delivery_city: 'Test City',
      p_delivery_branch: 'Test Branch',
      p_delivery_address: null,

      p_delivery_comment:
        'Автоматический тест KrisVane'
    }
  );


  if (error) {

    show(
      '❌ CHECKOUT ERROR\n\n' +
      error.message
    );

    return;
  }


  show(
    '🔥 ЗАКАЗ УСПЕШНО СОЗДАН!\n\n' +
    'Order ID: ' + data +
    '\n\nТеперь проверяем базу...'
  );
}


// ==========================================
// 4. ВОЗВРАТ ЗАКАЗА №1
// ==========================================

async function returnOrder1() {

  show('Возвращаем заказ №1 на склад...');


  const {
    data: { user },
    error: userError
  } = await db.auth.getUser();


  if (userError || !user) {

    show('❌ Пользователь не авторизован.');

    return;
  }


  const {
    error
  } = await db.rpc(
    'admin_return_order_to_stock',
    {
      p_order_id: 1
    }
  );


  if (error) {

    show(
      '❌ ОШИБКА ВОЗВРАТА\n\n' +
      error.message
    );

    return;
  }


  show(
    '✅ ВОЗВРАТ ВЫПОЛНЕН!\n\n' +
    'Order ID: 1\n' +
    'Пользователь: ' + user.email
  );
}


// ==========================================
// 5. ПРОВЕРКА ЗАЩИТЫ СТАТУСОВ
// ==========================================

async function testStatusManagement() {

  show(
    'Пробуем запрещённый переход:\n' +
    'returned → processing...'
  );


  const {
    error
  } = await db.rpc(
    'admin_set_order_status',
    {
      p_order_id: 1,
      p_new_status: 'processing'
    }
  );


  if (error) {

    show(
      '🔒 ПЕРЕХОД ОТКЛОНЁН\n\n' +
      error.message +
      '\n\n' +
      'Если заказ №1 имеет статус returned — ' +
      'это правильный результат.'
    );

    return;
  }


  show(
    '⚠️ Переход неожиданно был разрешён.'
  );
}


// ==========================================
// 6. ПРОВОДИМ ЗАКАЗ №2 ДО READY_TO_SHIP
// ==========================================

async function runOrder2Lifecycle() {

  show(
    'Проводим заказ №2 по статусам...'
  );


  const steps = [
    'confirmed',
    'processing',
    'ready_to_ship'
  ];


  for (const status of steps) {

    show(
      'Заказ №2\n\n' +
      'Устанавливаем статус: ' +
      status +
      '...'
    );


    const {
      error
    } = await db.rpc(
      'admin_set_order_status',
      {
        p_order_id: 2,
        p_new_status: status
      }
    );


    if (error) {

      show(
        '❌ ОШИБКА НА СТАТУСЕ: ' +
        status +
        '\n\n' +
        error.message
      );

      return;
    }
  }


  show(
    '✅ ЗАКАЗ №2 ГОТОВ К ОТПРАВКЕ!\n\n' +

    'pending → confirmed\n' +
    'confirmed → processing\n' +
    'processing → ready_to_ship\n\n' +

    'Текущий статус: ready_to_ship\n\n' +

    'Теперь можно вводить службу доставки и ТТН.'
  );
}


// ==========================================
// 7. ОТПРАВКА ЗАКАЗА №2
// ==========================================

async function shipOrder2() {

  const carrier =
    document.getElementById('carrier').value.trim();

  const trackingNumber =
    document.getElementById('trackingNumber').value.trim();


  if (!carrier) {

    show(
      '❌ Укажи службу доставки.'
    );

    return;
  }


  if (!trackingNumber) {

    show(
      '❌ Укажи ТТН.'
    );

    return;
  }


  show(
    '🚚 Отправляем заказ №2...\n\n' +
    'Служба: ' + carrier +
    '\nТТН: ' + trackingNumber
  );


  const {
    error
  } = await db.rpc(
    'admin_ship_order',
    {
      p_order_id: 2,
      p_carrier: carrier,
      p_tracking_number: trackingNumber
    }
  );


  if (error) {

    show(
      '❌ ОШИБКА ОТПРАВКИ\n\n' +
      error.message
    );

    return;
  }


  show(
    '🚚 ЗАКАЗ №2 ОТПРАВЛЕН!\n\n' +

    'Order ID: 2\n' +
    'Служба доставки: ' + carrier +
    '\nТТН: ' + trackingNumber +
    '\n\nСтатус: shipped ✅\n\n' +

    'KrisVane сохранил данные отправления.'
  );
}

</script>

</body>
</html>
